[project]
name = "ffmpeg-zeo"
dynamic = ["version"]
description = "Typed FFmpeg filter graphs for Python, CLIs, and coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Zero Employee Organizations" },
]
maintainers = [
    { name = "Rod Rivera", email = "rod@aip.engineer" },
]
keywords = [
    "FFmpeg",
    "ffprobe",
    "video",
    "audio",
    "filter_complex",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "ty>=0.0.1",
    "mcp>=1.9",
]

[project.urls]
Homepage = "https://github.com/zeroemployeeorg/ffmpeg-zeo"
Repository = "https://github.com/zeroemployeeorg/ffmpeg-zeo"
Documentation = "https://github.com/zeroemployeeorg/ffmpeg-zeo#readme"
Changelog = "https://github.com/zeroemployeeorg/ffmpeg-zeo/blob/main/CHANGELOG.md"
Issues = "https://github.com/zeroemployeeorg/ffmpeg-zeo/issues"

[project.scripts]
ffmpeg-zeo = "ffmpeg_zeo.cli:main"
ffmpeg-zeo-mcp = "ffmpeg_zeo.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmpeg_zeo"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ffmpeg_zeo",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    "Makefile",
    "pyproject.toml",
    "uv.lock",
]

[tool.hatch.version]
path = "src/ffmpeg_zeo/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=ffmpeg_zeo --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"
markers = [
    "integration: tests that invoke a real ffmpeg/ffprobe binary",
]

[tool.coverage.run]
source = ["ffmpeg_zeo"]
omit = ["*/mcp_server.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
    "PT",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
